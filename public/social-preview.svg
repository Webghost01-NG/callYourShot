  <text x="72" y="454" fill="#a2aaa5" font-family="Arial, Helvetica, sans-serif" font-size="23">Real DreamDEX fills · Somnia settlement · Bankroll-neutral ranking</text>
  <rect x="72" y="508" width="1056" height="1" fill="url(#line)"/>
  <text x="72" y="558" fill="#f5f7f2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">SIMPLE ON TOP.</text>
  <text x="253" y="558" fill="#baff3c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">VERIFIABLE UNDERNEATH.</text>
  <text x="1128" y="558" text-anchor="end" fill="#87908a" font-family="monospace" font-size="15">DREAMDEX × SOMNIA</text>
