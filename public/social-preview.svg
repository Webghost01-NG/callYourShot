<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Call Your Shot</title>
  <desc id="desc">Make a real DreamDEX call and let Somnia keep score.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="25%" r="70%">
      <stop offset="0" stop-color="#baff3c" stop-opacity=".13"/>
      <stop offset="1" stop-color="#baff3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#baff3c"/>
      <stop offset="1" stop-color="#baff3c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#080b0f"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="72" y="62" width="66" height="66" rx="17" fill="#baff3c"/>
  <circle cx="102" cy="99" r="15" fill="none" stroke="#080b0f" stroke-width="6"/>
  <circle cx="102" cy="99" r="5" fill="#080b0f"/>
  <path d="m106 95 20-20m-12 0h12v12" fill="none" stroke="#080b0f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
