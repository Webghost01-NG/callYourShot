  <text x="158" y="118" fill="#87908a" font-family="monospace" font-size="13" letter-spacing="2">PREDICTION SKILL LEAGUE</text>
  <text x="72" y="222" fill="#baff3c" font-family="monospace" font-size="16" font-weight="700" letter-spacing="4">PROOF OVER PROMISES</text>
